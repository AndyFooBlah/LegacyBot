name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# @andyfooblah/voice-common and @andyfooblah/knowledge-common install from
# npmjs.org like any other dependency — no sibling checkouts or PEER_REPO_TOKEN.
jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build (includes bundle secret scan)
        run: npm run build

  # Compile and test the Cloud Functions package separately. Root CI never
  # touched functions/, which is how a firebase-admin major (#172) merged
  # green and then failed in Cloud Build at deploy time (#177).
  functions:
    name: Functions Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
