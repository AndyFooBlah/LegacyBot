# Repo-specific toolchain for deps-fixer.yml (dependency program,
# AndyFooBlah/andy-private-docs#57). Mirrors the setup steps in ci.yml.
# CI runs the root app on Node 24 and functions/ on Node 22 (its engines
# field); the fixer gets Node 24, which runs both packages' commands.
name: deps-toolchain
description: Install the toolchain CI uses
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          functions/package-lock.json
